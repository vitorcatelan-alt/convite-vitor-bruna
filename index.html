<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ed">
<meta name="description" content="Convite digital — 10 anos de Vitor & Bruna. Uma noite árabe.">
<title>Vitor & Bruna · 10 anos de nós</title>
<style>
  :root {
    --ivory: #f7f4ed;
    --paper: #fffdf9;
    --brown: #765e4b;
    --gold: #8a6e12;
    --line: rgba(118,94,75,.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ivory); }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--brown);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(10px, env(safe-area-inset-top))
             0
             max(92px, env(safe-area-inset-bottom));
  }
  .intro {
    width: min(100%, 520px);
    text-align: center;
    padding: 12px 20px 8px;
  }
  .intro-title {
    letter-spacing: .28em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--gold);
    margin: 0;
  }
  .book {
    width: min(100%, 520px);
    position: relative;
  }
  .pages {
    display: flex;
    width: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .pages::-webkit-scrollbar { display: none; }
  .page {
    flex: 0 0 100%;
    scroll-snap-align: start;
    padding: 0 8px;
  }
  .page img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 2px;
    box-shadow: 0 10px 30px rgba(70,55,40,.10);
    background: white;
  }
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 13px 0 7px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    border: 1px solid rgba(118,94,75,.45);
    background: transparent;
    cursor: pointer;
    padding: 0;
  }
  .dot.active { background: var(--gold); border-color: var(--gold); }
  .hint {
    text-align: center;
    font-size: 11px;
    letter-spacing: .08em;
    opacity: .65;
    margin: 0 0 14px;
  }
  .actions {
    width: min(100% - 32px, 460px);
    display: grid;
    gap: 9px;
    margin-top: 4px;
  }
  .btn {
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 16px;
    border-radius: 999px;
    text-decoration: none;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 14px;
    letter-spacing: .03em;
    transition: transform .15s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--gold); color: white; }
  .btn-secondary { border: 1px solid var(--line); color: var(--brown); background: rgba(255,255,255,.65); }
  .footer {
    width: min(100% - 40px, 460px);
    text-align: center;
    margin-top: 16px;
    font-size: 11px;
    line-height: 1.6;
    opacity: .72;
  }
  .footer em { color: var(--gold); }
  @media (min-width: 700px) {
    .shell { padding-top: 22px; }
    .page { padding: 0; }
    .book { width: min(100%, 520px); }
    .page img { border-radius: 4px; }
  }
</style>
</head>

<script>
const pages = document.getElementById('pages');
const dots = [...document.querySelectorAll('.dot')];

function goToPage(index) {
  const width = pages.clientWidth;
  pages.scrollTo({ left: index * width, behavior: 'smooth' });
}

dots.forEach(dot => {
  dot.addEventListener('click', () => goToPage(Number(dot.dataset.index)));
});

let ticking = false;
pages.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const index = Math.round(pages.scrollLeft / pages.clientWidth);
    dots.forEach((d, i) => {
      d.classList.toggle('active', i === index);
      d.setAttribute('aria-current', i === index ? 'page' : 'false');
    });
    ticking = false;
  });
}, { passive: true });
</script>
