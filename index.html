<script>
(function(){
  const carousel = document.getElementById('carousel');
  const dots = [0,1,2].map(i => document.getElementById('dot'+i));

  // Always start a fresh visit at page 1.
  function startAtFirstPage() {
    carousel.scrollLeft = 0;
    requestAnimationFrame(() => {
      carousel.scrollLeft = 0;
      setTimeout(() => { carousel.scrollLeft = 0; }, 50);
    });
  }

  function updateDots() {
    const index = Math.round(carousel.scrollLeft / carousel.clientWidth);
    dots.forEach((d,i) => d.classList.toggle('active', i === index));
  }

  carousel.addEventListener('scroll', () => requestAnimationFrame(updateDots), {passive:true});
  window.addEventListener('resize', updateDots);

  // Run after DOM/layout is ready and when the page is shown/restored from bfcache.
  window.addEventListener('load', startAtFirstPage);
  window.addEventListener('pageshow', startAtFirstPage);
  document.addEventListener('DOMContentLoaded', startAtFirstPage);
  startAtFirstPage();
})();
</script>
